name: E2E

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# TEMPLATE: set repository variable BACKEND_REPO (e.g. your-user/blog-api).
# If the backend repo is private, also add secret BACKEND_REPO_TOKEN (a PAT with read access).
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: blogdb }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      CI: 'true'
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:5000/api
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: password123
      RESET_LOG_PATH: ${{ github.workspace }}/api.log
    steps:
      - uses: actions/checkout@v4
        with: { path: frontend }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPO }}
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Create the database schema
        run: for f in backend/database/*.sql; do mysql -h 127.0.0.1 -uroot -proot < "$f"; done

      - name: Start the backend (log is kept: the reset-password tests read it)
        working-directory: backend
        env: { PORT: 5000, DB_HOST: 127.0.0.1, DB_USER: root, DB_PASSWORD: root, DB_NAME: blogdb, JWT_SECRET: ci-only-secret, FRONTEND_URL: 'http://localhost:3000' }
        run: |
          npm ci
          nohup npm start > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/blogs >/dev/null && exit 0; sleep 2; done
          echo "API did not start"; cat "$GITHUB_WORKSPACE/api.log"; exit 1

      - name: Seed the admin account
        run: |
          curl -sf -X POST http://localhost:5000/api/auth/register -H 'Content-Type: application/json' \
            -d '{"firstname":"Admin","lastname":"User","email":"admin@example.com","password":"password123"}' || true
          mysql -h 127.0.0.1 -uroot -proot blogdb -e "UPDATE users SET role='admin' WHERE email='admin@example.com'"

      - name: Install and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Run the Playwright suites
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: backend-log, path: api.log }
